<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprova — Comprovante</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;font-family:Arial,sans-serif;color:#111}
header{background:#fff;border-bottom:1px solid #ddd;padding:18px;text-align:center}
.logo{font-size:30px;font-weight:800}.logo span{color:#7b00d4}
main{max-width:620px;margin:28px auto 50px;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:22px}p{margin:0 0 18px;color:#555;font-size:14px}
.receipt{display:block;width:100%;height:auto;border-radius:8px}
footer{text-align:center;color:#777;font-size:12px;padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="logo"><span>Com</span>prova</div></header>
<main><section class="card">
<h1>Comprovante de transferência</h1>
<p>Documento apresentado para visualização.</p>
<img class="receipt" src="comprovante.png" alt="Comprovante de transferência">
</section></main>
<footer>Comprova — visualização do documento</footer>
</body>
</html>
